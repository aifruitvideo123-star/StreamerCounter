name: Build Streamer Counter VIP (1.21.11)

on:
  push:
    branches: [vip/1.21.11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamer-counter-vip-1-21-11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build mod
        run: gradle -p streamercounter --no-daemon --stacktrace --warning-mode all clean build

      - name: Prepare mod JAR
        shell: bash
        run: |
          mkdir -p artifact
          find streamercounter/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifact/ ';'
          test "$(find artifact -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          ls -lh artifact/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: StreamerCounter-VIP-1.21.11
          path: artifact/*.jar
          if-no-files-found: error
