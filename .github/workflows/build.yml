name: Build Fabric Mod (26.2)

on:
  push:
    branches: [main, master, port/26.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build mod
        run: |
          echo "Building StreamerCounter for Minecraft 26.2"
          gradle -p streamercounter build --no-daemon

      - name: Prepare mod JAR
        shell: bash
        run: |
          mkdir -p artifact
          find streamercounter/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifact/ ';'
          test "$(find artifact -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          ls -lh artifact/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: StreamerCounter-Mod-26.2
          path: artifact/*.jar
          if-no-files-found: error
